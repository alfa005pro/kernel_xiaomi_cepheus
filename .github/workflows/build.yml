name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        # 完全匹配你截图中的路径：dabao1955
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          config: cepheus_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 13
          # 这一段是我们在 Action 基础上额外加的“核心调料”，用于集成 SukiSU
          extra-cmd: |
            # 注入 SukiSU 代码
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            
            # 针对小米 9 (4.14/Non-GKI) 执行手动挂钩
            sed -i '/ssize_t vfs_read(struct file/a \    extern int ksu_handle_read(struct file *, char __user *, size_t *, loff_t *);\n    ksu_handle_read(file, buf, &count, pos);' fs/read_write.c
            sed -i '/ssize_t vfs_write(struct file/a \    extern int ksu_handle_write(struct file *, const char __user *, size_t *, loff_t *);\n    ksu_handle_write(file, buf, &count, pos);' fs/read_write.c
            
            # 写入 Non-GKI 必需的内核配置
            echo "CONFIG_KSU=y" >> arch/arm64/configs/cepheus_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/cepheus_defconfig
            echo "CONFIG_KPM=y" >> arch/arm64/configs/cepheus_defconfig
            echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/cepheus_defconfig
