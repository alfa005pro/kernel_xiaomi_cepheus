name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          config: cepheus_defconfig
          arch: arm64
          android-version: 13
          aosp-gcc: true
          aosp-clang: true
          # 核心修复 1：不要指定 aosp-clang-version，避开 400 错误
          # 核心修复 2：使用官方自带的 ksu 开关，同样能实现 SukiSU 的效果
          ksu: true
          ksu-version: main
          # 核心修复 3：针对你的 Non-GKI 内核，直接通过编译器参数开启手动挂钩
          extra-make-args: CONFIG_KSU_MANUAL_HOOK=y CONFIG_OVERLAY_FS=y
