name: Manual Build Xiaomi 9 SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: alfa005pro/kernel_xiaomi_cepheus
          ref: thirteen
          path: kernel

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          # 关键长一智：除了 clang，必须安装 aarch64 交叉编译工具链和链接器
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm \
          binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Integrate SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # 针对 Non-GKI 4.14 物理挂钩
          sed -i '/ssize_t vfs_read(struct file/a \    extern int ksu_handle_read(struct file *, char __user *, size_t *, loff_t *);\n    ksu_handle_read(file, buf, &count, pos);' fs/read_write.c
          sed -i '/ssize_t vfs_write(struct file/a \    extern int ksu_handle_write(struct file *, const char __user *, size_t *, loff_t *);\n    ksu_handle_write(file, buf, &count, pos);' fs/read_write.c
          
          # 注入配置
          echo "CONFIG_KSU=y" >> arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/cepheus_defconfig

      - name: Start Compilation
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          # 使用系统自带的编译器，明确指定交叉编译器前缀
          make O=out ARCH=arm64 cepheus_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz
