name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          config: cepheus_defconfig
          arch: arm64
          android-version: 13
          aosp-gcc: true
          aosp-clang: true
          # 核心修复 1：不指定过时的 Clang 版本，让它自动选择可用的最新版
          # 核心修复 2：使用 Action 原生支持的 ksu 参数
          ksu: true
          ksu-version: main
          # 针对 Non-GKI 的手动挂钩配置
          extra-make-args: CONFIG_KSU_MANUAL_HOOK=y CONFIG_OVERLAY_FS=y
