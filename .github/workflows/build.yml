name: Final Build Xiaomi 9 SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: alfa005pro/kernel_xiaomi_cepheus
          ref: thirteen
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm \
          binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libyaml-dev

      - name: SukiSU & Fix Config
        run: |
          cd kernel
          # 1. 注入 SukiSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # 2. 针对 Non-GKI 4.14 物理挂钩
          sed -i '/ssize_t vfs_read(struct file/a \    extern int ksu_handle_read(struct file *, char __user *, size_t *, loff_t *);\n    ksu_handle_read(file, buf, &count, pos);' fs/read_write.c
          sed -i '/ssize_t vfs_write(struct file/a \    extern int ksu_handle_write(struct file *, const char __user *, size_t *, loff_t *);\n    ksu_handle_write(file, buf, &count, pos);' fs/read_write.c
          
          # 3. 核心修复：强制关掉报错的模块，开启 KSU
          cat <<EOF >> arch/arm64/configs/cepheus_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KPM=y
          CONFIG_OVERLAY_FS=y
          # 修复: 彻底关掉导致 ld 崩溃的 32 位 VDSO
          CONFIG_VDSO32=n
          CONFIG_COMPAT_VDSO=n
          # 修复: 关掉导致 DTC 报错的 YAML 检查
          CONFIG_DTC_YAML=n
          EOF

      - name: Build Kernel
        run: |
          cd kernel
          mkdir -p out
          export ARCH=arm64
          # 这一步生成配置
          make O=out ARCH=arm64 cepheus_defconfig
          
          # 关键长一智：统一工具链，避免混合使用系统 ld 导致的架构错误
          make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi9-SukiSU-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
