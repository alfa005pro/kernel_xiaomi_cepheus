name: Final Success Build Xiaomi 9 SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: alfa005pro/kernel_xiaomi_cepheus
          ref: thirteen
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev libyaml-dev libssl-dev

      - name: Download Proton Clang
        run: |
          mkdir toolchain
          cd toolchain
          # 下载预编译好的 Proton Clang (包含交叉编译器)
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz
          echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchain/proton-clang-master/bin" >> $GITHUB_ENV

      - name: SukiSU & Fix Config
        run: |
          cd kernel
          # 1. 注入 SukiSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # 2. 针对 4.14 Non-GKI 物理挂钩
          sed -i '/ssize_t vfs_read(struct file/a \    extern int ksu_handle_read(struct file *, char __user *, size_t *, loff_t *);\n    ksu_handle_read(file, buf, &count, pos);' fs/read_write.c
          sed -i '/ssize_t vfs_write(struct file/a \    extern int ksu_handle_write(struct file *, const char __user *, size_t *, loff_t *);\n    ksu_handle_write(file, buf, &count, pos);' fs/read_write.c
          
          # 3. 强制写入配置，绕过 DTC_YAML 和 VDSO32 坑
          cat <<EOF >> arch/arm64/configs/cepheus_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_OVERLAY_FS=y
          CONFIG_VDSO32=n
          CONFIG_DTC_YAML=n
          EOF

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 cepheus_defconfig
          
          # 使用 Proton Clang 完整全家桶，避开系统链接器
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi9-SukiSU-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
