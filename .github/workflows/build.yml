name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          config: cepheus_defconfig
          arch: arm64
          android-version: 13
          aosp-gcc: true
          # 【重磅修改】不再让它自己乱找 Clang
          aosp-clang: true
          # 这里换成一个社区维护的、确定存活的 Clang 下载直链（例如阿里云或华为镜像，此处以占位符示意）
          # 或者直接不写版本号，但在下一步强制指定路径
          
          # 【集成 SukiSU】改用该插件认可的参数名
          ksu: true
          ksu-version: main
          
          # 【解决 Non-GKI 挂钩】
          # 既然 extra-cmd 不管用，我们把参数直接塞进 make 过程
          extra-make-args: |
            CONFIG_KSU_MANUAL_HOOK=y
            CONFIG_OVERLAY_FS=y
            CC=clang
