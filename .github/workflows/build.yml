name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          # 确认使用截图 1 中的配置文件名
          config: cepheus_defconfig
          arch: arm64
          android-version: 13
          aosp-gcc: true
          aosp-clang: true
          # 【核心修复】删除 aosp-clang-version 这一行，让它自动选择最新可用版本，解决 400 错误
          
          # 【SukiSU 集成】使用插件官方支持的原生开关
          ksu: true
          ksu-version: main
          
          # 【Non-GKI 适配】由于无法使用 extra-cmd，我们通过编译器参数强制开启手动挂钩
          extra-make-args: CONFIG_KSU_MANUAL_HOOK=y CONFIG_OVERLAY_FS=y
