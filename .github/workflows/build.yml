name: Build Xiaomi 9 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/alfa005pro/kernel_xiaomi_cepheus
          kernel-branch: thirteen
          config: cepheus_defconfig
          arch: arm64
          android-version: 13
          aosp-gcc: true
          aosp-clang: true
          # 修复 1：删除报错的 aosp-clang-version，让系统自动选择可用版本
          # 修复 2：启用原生 KSU 支持
          ksu: true
          ksu-version: main
          # 修复 3：针对 Non-GKI 4.14 内核，通过编译器参数开启手动挂钩
          extra-make-args: CONFIG_KSU_MANUAL_HOOK=y CONFIG_OVERLAY_FS=y
