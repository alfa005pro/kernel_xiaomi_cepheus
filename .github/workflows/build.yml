name: Final Manual Build Xiaomi 9 SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: alfa005pro/kernel_xiaomi_cepheus
          ref: thirteen
          path: kernel

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm \
          binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: SukiSU & Physical Fix
        run: |
          cd kernel
          # 1. 注入 SukiSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # 2. 物理挂钩
          sed -i '/ssize_t vfs_read(struct file/a \    extern int ksu_handle_read(struct file *, char __user *, size_t *, loff_t *);\n    ksu_handle_read(file, buf, &count, pos);' fs/read_write.c
          sed -i '/ssize_t vfs_write(struct file/a \    extern int ksu_handle_write(struct file *, const char __user *, size_t *, loff_t *);\n    ksu_handle_write(file, buf, &count, pos);' fs/read_write.c
          
          # 3. 【核心长一智】物理删除导致报错的 scripts 文件
          # 既然 yamltree 链接不上，我们直接清空它的内容，让它变成空函数，不链接 libyaml
          echo "int main() { return 0; }" > scripts/dtc/yamltree.c
          
          # 4. 强制配置
          cat <<EOF >> arch/arm64/configs/cepheus_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_OVERLAY_FS=y
          CONFIG_VDSO32=n
          EOF

      - name: Build Kernel
        run: |
          cd kernel
          mkdir -p out
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out ARCH=arm64 cepheus_defconfig
          
          # 使用系统原生工具，但避开 32 位和逻辑错误
          make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel/out/arch/arm64/boot/Image.gz
